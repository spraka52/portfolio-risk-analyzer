services:
  - type: web
    name: portfolio-risk-backend
    runtime: docker
    dockerfilePath: ./portfolio-backend/Dockerfile
    dockerContext: ./portfolio-backend
    plan: free
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: portfolio-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: portfolio-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: FINNHUB_API_KEY
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://portfolio-risk-analyzer-seven.vercel.app

databases:
  - name: portfolio-db
    databaseName: portfolio
    plan: free
