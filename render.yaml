services:
  - type: web
    name: portfolio-analyzer-backend
    runtime: java
    rootDir: portfolio-backend
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -Dserver.port=$PORT -Dspring.profiles.active=prod -jar target/portfolio-analyzer-1.0.0.jar
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: FINNHUB_API_KEY
        sync: false

databases:
  - name: portfolio-db
    databaseName: portfolio_db
    plan: free
