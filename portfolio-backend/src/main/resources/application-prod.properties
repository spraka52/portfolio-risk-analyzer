# Production (Render, Railway, etc.) — same env vars as default profile where possible
spring.application.name=portfolio-analyzer
server.port=${PORT:8081}

# Database (Render Blueprint sets SPRING_DATASOURCE_*; Railway may use DATABASE_URL)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/portfolio_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — set JWT_SECRET on the host; fallback only so the app can boot if env is missing
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits-long-at-least}
jwt.expiration=86400000

# Finnhub API
finnhub.api.key=${FINNHUB_API_KEY:d5u4k6hr01qtjet20al0d5u4k6hr01qtjet20alg}

# CORS (Render Blueprint uses CORS_ALLOWED_ORIGINS)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:${CORS_ORIGINS:https://portfolio-risk-analyzer-seven.vercel.app}}

# Logging
logging.level.com.portfolio.analyzer=INFO
logging.level.org.springframework.security=WARN
