# Application
spring.application.name=portfolio-analyzer
server.port=${PORT:8081}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portfolio_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:your-secret-key-change-this-in-production-min-256-bits-long-at-least}
jwt.expiration=86400000

# Finnhub API
finnhub.api.key=${FINNHUB_API_KEY:d5u4k6hr01qtjet20al0d5u4k6hr01qtjet20alg}

# CORS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://portfolio-risk-analyzer-seven.vercel.app}

# Logging
logging.level.com.portfolio.analyzer=DEBUG
logging.level.org.springframework.security=DEBUG

# Actuator & Metrics
management.endpoints.web.exposure.include=health,metrics,prometheus,info
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.info.env.enabled=true

# Performance metrics
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Info endpoint
info.app.name=Portfolio Risk Analyzer
info.app.description=Backend API for portfolio risk analysis
info.app.version=1.0.0

